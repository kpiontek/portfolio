# The remote mirror of the pre-push lefthook stage: same checks, same order, so
# a push that passes locally passes here.
name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing in this workflow writes back to the repo.
permissions:
  contents: read

# A newer push makes an in-flight run pointless, so cancel it.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # .nvmrc is the single source of truth for the Node version.
          node-version-file: .nvmrc
          cache: npm

      # ci, not install, so the lockfile alone decides every version.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # knip fails on dead files and unused dependencies before they pile up.
      - name: Knip
        run: npm run knip

      # Build before the tests: the prerender and browser suites read dist/.
      - name: Build
        run: npm run build

      # The browser suite drives real Chromium, which the runner lacks.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test
