# Pull request titles become the squash commit subject, so they follow the same
# plain English convention the commit-msg hook enforces locally. The title is
# passed through an environment variable, never interpolated into the shell.
name: commit-message

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: commit-message-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Validate the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-message.mjs --env PR_TITLE
